# nginx site for the staging VPS. Installed once by someone with root (docs/runbooks/vps-staging.md):
#   copy to /etc/nginx/sites-available/navagrahaai.newgc.in, link into sites-enabled,
#   `nginx -t && systemctl reload nginx`, then `certbot --nginx -d navagrahaai.newgc.in` adds HTTPS.
# Only the web app is public; the API stays on 127.0.0.1 and is reached by the web app alone.
server {
    listen 80;
    listen [::]:80;
    server_name navagrahaai.newgc.in;

    # Temple data workbooks are uploaded on /ops/temples.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API rate-limits sign-in by this address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_navagraha;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade_navagraha {
    default upgrade;
    ''      close;
}

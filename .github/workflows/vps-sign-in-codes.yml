# Shows recent staging sign-in codes, so nobody needs a server login to read them.
# Until an SMS provider is chosen (D-11), staging prints codes to the API log with the phone
# masked (+91******1234). Actions → "Staging sign-in codes" → Run workflow, then open the run.

name: Staging sign-in codes

on:
  workflow_dispatch:

jobs:
  codes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Latest codes (newest last; each works once and expires quickly)
        run: ssh vps "grep -h 'Sign-in code for' ~/navagraha/logs/api.log | tail -n 10" || echo "No codes yet."
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key

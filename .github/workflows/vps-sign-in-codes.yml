# Shows recent staging sign-in codes, so nobody needs a server login to read them.
# Until an SMS provider is chosen (D-11), staging prints codes to the API log with the phone
# masked (+91******1234). Actions → "Staging sign-in codes" → Run workflow, then open the run.

name: Staging sign-in codes

on:
  workflow_dispatch:

jobs:
  codes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      - name: Latest codes (newest last; each works once, for 5 minutes)
        run: |
          ssh vps 'bash -s' <<'SH'
          now=$(date +%s)
          lines=$(grep -h "Sign-in code for" ~/navagraha/logs/api.log 2>/dev/null | tail -n 5)
          [ -n "$lines" ] || { echo "No codes yet. Request one on the sign-in page first."; exit 0; }
          printf '%s\n' "$lines" | while IFS= read -r line; do
            # pm2 prefixes each line with the server's local time: 2026-10-21T15:01:18:
            ts=$(printf '%s' "$line" | cut -c1-19 | tr T ' ')
            age=$(( (now - $(date -d "$ts" +%s)) / 60 ))
            what=$(printf '%s' "$line" | grep -oE 'for \+[0-9*]+: [0-9]{6}')
            if [ "$age" -lt 5 ]; then state="VALID — use within $((5 - age)) min"; else state="expired"; fi
            echo "$what   ($age min ago, $state)"
          done
          SH
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: navagraha
          POSTGRES_PASSWORD: navagraha
          POSTGRES_DB: navagraha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navagraha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://navagraha:navagraha@localhost:5432/navagraha_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git status --porcelain packages/db/drizzle
          test -z "$(git status --porcelain packages/db/drizzle)"
      - name: Test
        run: pnpm test

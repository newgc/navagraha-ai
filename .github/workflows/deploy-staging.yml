# Deploys main to the staging server (navagrahaai.newgc.in) after CI passes on it.
#
# Secrets (GitHub → Settings → Environments → "staging"; printed by deploy/setup-server.sh):
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_KNOWN_HOSTS, STAGING_PORT (optional, 22)
#
# Builds once here, ships the built tree (production dependencies only) and runs
# deploy/remote-deploy.sh on the server: database backup → migrations → switch → restart →
# health check, rolling back to the previous release if the new one is unhealthy.

name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required secrets
        id: secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          missing=""
          for v in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_KNOWN_HOSTS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            # Not set up yet: skip quietly instead of failing every push (see docs/runbooks/staging-server.md).
            echo "::notice::Staging deploy skipped — missing secrets in the staging environment:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build
        if: steps.secrets.outputs.configured == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package release
        if: steps.secrets.outputs.configured == 'true'
        run: |
          # Keep only what runs in production; the built output stays.
          pnpm install --prod --frozen-lockfile
          name="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA_SHORT:-$(git rev-parse --short HEAD)}"
          echo "RELEASE=$name" >> "$GITHUB_ENV"
          tar -czf "/tmp/$name.tgz" \
            --exclude=.git --exclude='*.tsbuildinfo' --exclude=apps/web/.next/cache \
            --exclude=apps/web/test-results --exclude=docs/spec .
          ls -lh "/tmp/$name.tgz"

      - name: Set up SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${STAGING_PORT:-22}"
          if [ "$port" = "22" ]; then hostspec="$STAGING_HOST"; else hostspec="[$STAGING_HOST]:$port"; fi
          # ssh-keyscan run on the server labels keys "localhost"; relabel them to the real host.
          printf '%s\n' "$STAGING_KNOWN_HOSTS" \
            | sed -E "s/^(\[?localhost\]?(:[0-9]+)?|[^ ]+) /$hostspec /" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host staging
            HostName $STAGING_HOST
            Port $port
            User ${{ secrets.STAGING_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      - name: Upload and deploy
        if: steps.secrets.outputs.configured == 'true'
        run: |
          scp -q "/tmp/$RELEASE.tgz" "staging:/srv/navagraha/releases/$RELEASE.tgz"
          ssh staging "set -e
            cd /srv/navagraha/releases
            mkdir '$RELEASE'
            tar -xzf '$RELEASE.tgz' -C '$RELEASE'
            rm '$RELEASE.tgz'
            bash '$RELEASE/deploy/remote-deploy.sh'"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key

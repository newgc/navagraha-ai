services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: navagraha
      POSTGRES_PASSWORD: navagraha
      POSTGRES_DB: navagraha
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U navagraha']
      interval: 5s
      retries: 10
volumes:
  pgdata:
